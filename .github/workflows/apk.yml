name: Bouw Android APK
on: [push, workflow_dispatch]
permissions: {contents: read}
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.9'}
      - run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with: {name: Jumbo-Speurclub-APK, path: app/build/outputs/apk/debug/app-debug.apk}
  # Publish this delivery on its own branch, never directly to main.
  standalone:
    if: github.event_name == 'push' && github.ref == 'refs/heads/arena/5f306e97-jumbo-game-app' && contains(github.event.head_commit.message, '[standalone-apk]')
    runs-on: ubuntu-latest
    permissions: {contents: write}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.9'}
      - run: gradle assembleRelease
      - name: Sign and verify standalone APK
        env:
          SIGNING_P12: ${{ secrets.SPEURCLUB_SIGNING_P12 }}
        run: |
          set -euo pipefail
          tools="$ANDROID_HOME/build-tools/35.0.0"
          if [ -n "$SIGNING_P12" ]; then
            printf '%s' "$SIGNING_P12" | base64 -d > "$RUNNER_TEMP/signer.p12"
            export STORE_PASS=''
          else
            export STORE_PASS="$(openssl rand -hex 24)"
            keytool -genkeypair -noprompt -keystore "$RUNNER_TEMP/signer.p12" -storetype PKCS12 -storepass:env STORE_PASS -alias speurclub -keyalg RSA -keysize 3072 -validity 10000 -dname 'CN=Jumbo Speurclub'
          fi
          "$tools/zipalign" -f 4 app/build/outputs/apk/release/app-release-unsigned.apk "$RUNNER_TEMP/aligned.apk"
          "$tools/apksigner" sign --ks "$RUNNER_TEMP/signer.p12" --ks-pass env:STORE_PASS --out Jumbo-Speurclub.apk "$RUNNER_TEMP/aligned.apk"
          "$tools/apksigner" verify --verbose Jumbo-Speurclub.apk
          unzip -tq Jumbo-Speurclub.apk
          rm -f "$RUNNER_TEMP/signer.p12"
      - name: Enable emulator acceleration
        run: sudo chmod 666 /dev/kvm
      - name: Verify first-run camera permission and live preview on signed APK
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back emulated
          script: python3 tests/camera-smoke.py
      - name: Publish verified APK at the repository root
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Jumbo-Speurclub.apk
          git commit -m 'Deliver signed standalone Android APK'
          git push origin "HEAD:$GITHUB_REF_NAME"
