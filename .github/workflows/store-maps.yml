name: Prepare offline BRT maps
on: push
jobs:
  maps:
    if: github.ref == 'refs/heads/arena/b5797b77-jumbo-game-app' && contains(github.event.head_commit.message, '[prepare-maps]')
    runs-on: ubuntu-latest
    permissions: {contents: write}
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install Pillow && python tools/store_maps.py
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/maps
          git commit -m 'Bundle georeferenced Dongen and Breda BRT map crops'
          git push origin "HEAD:$GITHUB_REF_NAME"
